<!--/*
  cf-promo — HTL server-side renderer.

  AEM resolves this script via resourceType
  "aem-shift-left-testing/components/blocks/cf-promo".

  cf-promo-model.js reads properties.reference (the CF DAM path),
  resolves the ContentFragment via Sling, and exposes:
    m.aueCf       — "urn:aemconnection:{cfPath}" for UE instrumentation
    m.title       — CF title field (plain text)
    m.description — CF description field (plain text)
    m.ctaText     — CF ctaText field (plain text)
    m.ctaLink     — CF ctaLink field (plain text URL)
*/-->
<sly data-sly-use.m="cf-promo-model.js" />

<!--/* Nothing to render if no fragment is configured. */-->
<sly data-sly-test="${!m.cfPath}"></sly>

<sly data-sly-test="${m.cfPath}">

  <h2 class="cf-promo-title"
      data-aue-resource="${m.aueCf @ context='attribute'}"
      data-aue-prop="title"
      data-aue-type="text">${m.title}</h2>

  <p class="cf-promo-description"
     data-aue-resource="${m.aueCf @ context='attribute'}"
     data-aue-prop="description"
     data-aue-type="text">${m.description}</p>

  <p class="cf-promo-cta button-container">
    <a class="button primary"
       href="${m.ctaLink @ context='uri'}"
       data-aue-resource="${m.aueCf @ context='attribute'}"
       data-aue-prop="ctaLink"
       data-aue-type="text">${m.ctaText}</a>
  </p>

</sly>
